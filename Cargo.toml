[package]
name = "nofx-rust"
version = "0.1.0"
edition = "2024"
default-run = "nofx-server"

[lib]
name = "nofx_core"
path = "rust/src/lib.rs"

[[bin]]
name = "nofx-server"
path = "rust/src/main.rs"

