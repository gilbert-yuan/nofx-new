[package]
name = "nofx-rust"
version = "0.1.0"
edition = "2024"
default-run = "nofx-server"

[lib]
name = "nofx_core"
path = "rust/src/lib.rs"

[[bin]]
name = "nofx-server"
path = "rust/src/main.rs"

[[bin]]
name = "nofx-diagnostics"
path = "rust/src/bin/nofx-diagnostics.rs"

[[bin]]
name = "nofx-orphan-audit"
path = "rust/src/bin/nofx-orphan-audit.rs"

[[bin]]
name = "nofx-ml-collect"
path = "rust/src/bin/nofx-ml-collect.rs"

[[bin]]
name = "nofx-ml-archive"
path = "rust/src/bin/nofx-ml-archive.rs"

[[bin]]
name = "nofx-ml-archive-repair"
path = "rust/src/bin/nofx-ml-archive-repair.rs"

[[bin]]
name = "nofx-altcoin-backtest"
path = "rust/src/bin/nofx-altcoin-backtest.rs"

[[bin]]
name = "nofx-altcoin-verify"
path = "rust/src/bin/nofx-altcoin-verify.rs"

[[test]]
name = "backend-integration"
path = "rust/tests/backend.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Keep Windows release builds within the memory budget; strategy/replay code remains optimized.
lto = false
codegen-units = 16

